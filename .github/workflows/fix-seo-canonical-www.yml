name: One-time SEO canonical www fix

on:
  push:
    branches:
      - fix/seo-canonical-www-20260905
    paths:
      - .github/workflows/fix-seo-canonical-www.yml

permissions:
  contents: write

jobs:
  fix-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/seo-canonical-www-20260905
          fetch-depth: 0

      - name: Align all public SEO URLs with the www host
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old = "https://hairacademiadabeleza.com.br"
          new = "https://www.hairacademiadabeleza.com.br"

          for name in (
              "site-hair/index.html",
              "site-hair/sitemap.xml",
              "site-hair/robots.txt",
          ):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              path.write_text(text.replace(old, new), encoding="utf-8")

          privacy = Path("site-hair/privacidade.html")
          text = privacy.read_text(encoding="utf-8")
          if 'rel="canonical"' not in text:
              lines = text.splitlines()
              for i, line in enumerate(lines):
                  if line.startswith('<meta name="description"'):
                      lines.insert(i + 1, '<link rel="canonical" href="https://www.hairacademiadabeleza.com.br/privacidade">')
                      break
              else:
                  raise SystemExit("description meta not found in privacidade.html")
              text = "\n".join(lines) + ("\n" if text.endswith("\n") else "")
              privacy.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-hair/index.html site-hair/sitemap.xml site-hair/robots.txt site-hair/privacidade.html
          if git diff --cached --quiet; then
            echo "No SEO changes needed."
            exit 0
          fi
          git commit -m "fix(seo): align canonical URLs with www"
          git push origin HEAD:fix/seo-canonical-www-20260905
