name: HARA publica - testes automaticos

on:
  push:
    branches: [main, work/hara-public-chat]
    paths:
      - 'site-hair/**'
      - 'scripts/hara/**'
      - 'scripts/site-hair/**'
      - '.github/workflows/hara-public-tests.yml'
      - 'AGENTS.md'
  pull_request:
    paths:
      - 'site-hair/**'
      - 'scripts/hara/**'
      - 'scripts/site-hair/**'
      - '.github/workflows/hara-public-tests.yml'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hara-public-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seguranca:
    name: Seguranca e contrato
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Testes de seguranca do atendimento e contrato do site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/hara-unit
          node --test scripts/hara/security.test.cjs scripts/hara/business.test.cjs scripts/hara/knowledge.test.cjs scripts/hara/acervo.test.cjs | tee output/hara-unit/security.txt
          python3 scripts/site-hair/checar-contrato.py | tee output/hara-unit/site-contract.txt
          node --check site-hair/api/hara-public.js
          node --check site-hair/hara/chat.js
      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hara-seguranca-${{ github.run_id }}
          path: output/hara-unit/
          if-no-files-found: warn
          retention-days: 7

  redis:
    name: Limites reais em Redis descartavel
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      redis:
        image: redis:7.4.6-alpine@sha256:3b73847e72874be07e6657b129a94761662b79bc0f679273757d4218573b2a98
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Concorrencia, cotas e expiracao com o Lua da aplicacao
        run: python3 scripts/hara/redis.ci.py
      - name: Guardar resultados do Redis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hara-redis-${{ github.run_id }}
          path: output/hara-redis/
          if-no-files-found: warn
          retention-days: 7

  navegador:
    name: Navegador ${{ matrix.browser }}
    needs: [seguranca, redis]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      NODE_PATH: ${{ runner.temp }}/hara-playwright/node_modules
      BROWSER_ENGINE: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Instalar versao fixada de Playwright e navegador
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/hara-playwright" --no-save --no-package-lock playwright@1.62.1
          node "$RUNNER_TEMP/hara-playwright/node_modules/playwright/cli.js" install --with-deps "${{ matrix.browser }}"
      - name: Testar layouts, emulacao mobile, consentimento, envio e falhas
        run: node scripts/hara/browser.test.cjs
      - name: Guardar capturas e relatorio inclusive em falha
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hara-browser-${{ matrix.browser }}-${{ github.run_id }}
          path: output/hara-browser/
          if-no-files-found: warn
          retention-days: 7
