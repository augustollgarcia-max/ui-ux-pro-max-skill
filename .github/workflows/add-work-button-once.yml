name: Add Conexao Work button once

on:
  push:
    branches:
      - chatgpt/site-add-conexao-work-20260822

permissions:
  contents: write

jobs:
  patch-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/site-add-conexao-work-20260822
          fetch-depth: 0

      - name: Add Conexao Work access
        shell: python
        run: |
          from pathlib import Path
          p = Path('site-hair/index.html')
          s = p.read_text(encoding='utf-8')
          work = 'https://app.hairacademiadabeleza.com.br/work.html'

          old = '<a class="nav-cta" href="https://app.hairacademiadabeleza.com.br" target="_blank" rel="noopener">Acessar Conexão</a>'
          new = '<a class="nav-cta" href="https://app.hairacademiadabeleza.com.br" target="_blank" rel="noopener">Conexão Hair</a>'
          assert old in s, 'desktop CTA not found'
          s = s.replace(old, new, 1)

          old = '<a class="btn gold" href="https://app.hairacademiadabeleza.com.br" target="_blank" rel="noopener">Acessar Conexão</a>'
          new = old.replace('Acessar Conexão', 'Conexão Hair') + f'\n  <a class="btn ghost" style="margin-top:8px" href="{work}" target="_blank" rel="noopener">Conexão Work</a>'
          assert old in s, 'mobile CTA not found'
          s = s.replace(old, new, 1)

          anchor = '<a class="btn ghost" href="https://app.hairacademiadabeleza.com.br" target="_blank" rel="noopener">Já sou aluno</a>'
          addition = anchor + f'\n        <a class="btn gold" href="{work}" target="_blank" rel="noopener">Acessar Conexão Work</a>'
          assert anchor in s, 'hero student CTA not found'
          s = s.replace(anchor, addition, 1)

          footer = '<a href="https://app.hairacademiadabeleza.com.br" target="_blank" rel="noopener">Acessar Conexão Hair</a>'
          footer_new = footer + f'\n        <a href="{work}" target="_blank" rel="noopener">Acessar Conexão Work</a>'
          assert footer in s, 'footer link not found'
          s = s.replace(footer, footer_new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit only the site change
        run: |
          git rm .github/workflows/add-work-button-once.yml
          git add site-hair/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(site): adiciona acesso ao Conexão Work"
          git push origin HEAD:chatgpt/site-add-conexao-work-20260822
