// HARA Vision · teste gratuito (1 por pessoa): foto + WhatsApp → função pública do Supabase.
(function(){const f=document.getElementById('hvtrial');if(!f)return;const foto=f.querySelector('#hvFoto'),prev=f.querySelector('.hv-drop img'),zap=f.querySelector('#hvZap'),st=f.querySelector('.hv-status'),res=f.querySelector('.hv-result');
let blob=null;const KEY='hv_teste_usado';

const URL_T='https://zoyyfvfvnxrpojhypsjh.supabase.co/functions/v1/hara-vision-teste';const esc=s=>String(s==null?'':s).replace(/[<&]/g,c=>c==='<'?'&lt;':'&amp;');
function comprimir(file){return new Promise((ok,er)=>{const img=new Image();img.onload=()=>{const m=1100,s=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.82).split(',')[1]);URL.revokeObjectURL(img.src)};img.onerror=er;img.src=URL.createObjectURL(file)})}
function laudoHTML(d,zapDigits){const l=d.laudo||{},ov=l.overall||{},cr=(l.criteria||[]).map(c=>'<li><b>'+esc(c.name||c.id)+'</b>'+(c.status==='nao_avaliavel'||c.score==null?'Não observável':Number(c.score).toFixed(1)+' / 10')+'<br><small>'+esc(c.improvement||c.diagnosis||'')+'</small></li>').join('');
const mp=l.main_priority||{},nt=l.next_training||{},score=(Number(d.score)||0).toFixed(1);
return '<span class="label">Laudo HARA Vision · confiança '+esc(ov.confidence||'')+'</span><div class="hvn">'+score+' <small>/ 10</small></div><p>'+esc(ov.summary||'')+'</p><ul>'+cr+'</ul>'+(mp.title?'<p style="margin-top:12px"><b>Prioridade:</b> '+esc(mp.title)+' — '+esc(mp.reason||'')+'</p>':'')+(nt.name?'<p><b>Próximo treino:</b> '+esc(nt.name)+' — '+esc(nt.objective||'')+'</p>':'')+(l.final_statement?'<p class="gold" style="font-weight:700">'+esc(l.final_statement)+'</p>':'')+'<p class="micro">A avaliação oficial é sempre a do professor. Esta foi a sua análise gratuita.</p><a class="btn ghost sm" target="_blank" rel="noopener" href="https://wa.me/'+f.dataset.wa+'?text='+encodeURIComponent('Fiz o teste gratuito da HARA Vision pelo site e tirei '+score+'. Meu WhatsApp: '+zapDigits+'. Quero saber mais sobre a HAIR.')+'">Continuar no WhatsApp da HAIR</a>'}
})();
